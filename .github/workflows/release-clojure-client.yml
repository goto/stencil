name: Release Stencil Clojure Client
on:
  push:
    tags:
      - "v*.*.*"
      - "clojure-client-v*.*.*"
  workflow_dispatch:
    inputs:
      releaseVersion:
        description: "Clojure client version to publish (for example: 0.2.1)"
        required: true
        type: string

jobs:
  publish-clojure-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve release version
        id: release
        env:
          INPUT_VERSION: ${{ github.event.inputs.releaseVersion }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            version="${GITHUB_REF_NAME#clojure-client-v}"
            version="${version#v}"
          else
            version="${INPUT_VERSION#v}"
          fi

          if [ -z "$version" ]; then
            echo "::error::Unable to determine the Clojure client release version."
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8
      - name: Install clojure tools
        uses: DeLaGuardo/setup-clojure@4.0
        with:
          lein: 2.9.8
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set project version
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        working-directory: clients/clojure
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("project.clj")
          text = path.read_text()
          version = os.environ["RELEASE_VERSION"]
          updated, count = re.subn(
              r'(\(defproject\s+com\.gotocompany/stencil-clj\s+")([^"]+)(")',
              rf'\g<1>{version}\g<3>',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit("Unable to update Clojure client version in project.clj")
          path.write_text(updated)
          PY
      - name: Skip if version already exists on Clojars
        id: published
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          metadata_url="https://repo.clojars.org/com/gotocompany/stencil-clj/maven-metadata.xml"
          if curl -fsSL "$metadata_url" | grep -q "<version>${RELEASE_VERSION}</version>"; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "Clojure client version ${RELEASE_VERSION} is already published. Skipping release."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish Clojure Client
        if: steps.published.outputs.published != 'true'
        env:
          CLOJARE_ARTIFACTORY_USERNAME: ${{ secrets.CLOJARE_ARTIFACTORY_USERNAME }}
          CLOJARE_ARTIFACTORY_PASSWORD: ${{ secrets.CLOJARE_ARTIFACTORY_PASSWORD }}
        working-directory: clients/clojure
        run: lein deploy release

