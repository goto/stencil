name: Release Stencil Java Client
on:
  push:
    tags:
      - "v*.*.*"
      - "java-client-v*.*.*"
  workflow_dispatch:
    inputs:
      releaseVersion:
        description: "Java client version to publish (for example: 0.7.1)"
        required: true
        type: string

jobs:
  publish-java-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve release version
        id: release
        env:
          INPUT_VERSION: ${{ github.event.inputs.releaseVersion }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            version="${GITHUB_REF_NAME#java-client-v}"
            version="${version#v}"
          else
            version="${INPUT_VERSION#v}"
          fi

          if [ -z "$version" ]; then
            echo "::error::Unable to determine the Java client release version."
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8
      - name: Skip if version already exists on Maven Central
        id: published
        run: |
          metadata_url="https://repo.maven.apache.org/maven2/com/gotocompany/stencil/maven-metadata.xml"
          if curl -fsSL "$metadata_url" | grep -q "<version>${{ steps.release.outputs.version }}</version>"; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "Java client version ${{ steps.release.outputs.version }} is already published. Skipping release."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish java client
        if: steps.published.outputs.published != 'true'
        run: |
          printf "$GPG_SIGNING_KEY" | base64 --decode > private.key
          ./gradlew clean publish -PreleaseVersion=${{ steps.release.outputs.version }} -PuseSonatypeStaging=false -Psigning.keyId=${GPG_SIGNING_KEY_ID} -Psigning.password=${GPG_SIGNING_PASSWORD} -Psigning.secretKeyRingFile=private.key --console=verbose
        working-directory: clients/java
        env:
          MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.OSSRH_TOKEN }}
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_SIGNING_KEY_ID: ${{ secrets.GPG_SIGNING_KEY_ID }}
          GPG_SIGNING_PASSWORD: ${{ secrets.GPG_SIGNING_PASSWORD }}
